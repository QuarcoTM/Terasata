name: Build authentic responsive images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-responsive-images.yml'
      - 'scripts/build-responsive-images.py'
      - 'assets/images/terrace.webp'
      - 'assets/images/main-hall.webp'
      - 'assets/images/celebration-table.webp'
      - 'assets/images/second-floor.webp'
      - 'assets/images/bar.webp'
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Create smaller original-photo WebP files
        run: python scripts/build-responsive-images.py
      - name: Commit optimized photos
        run: |
          git add assets/images/*-480.webp assets/images/*-960.webp assets/images/*-1280.webp
          if git diff --cached --quiet; then
            echo "Responsive variants already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add compressed authentic restaurant photos [skip ci]"
          git push origin HEAD:main
